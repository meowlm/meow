[package]
name = "meow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = { version = "0.18.6", features = ["improved_unicode"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = { version = "0.23.2", features = ["onig"] }
